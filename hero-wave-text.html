<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Wave Text Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Starfield Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        /* Hero Container */
        .hero-section {
            text-align: center;
            z-index: 10;
            padding: 40px;
        }

        /* Top Label */
        .top-label {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 8px;
            color: #00d4ff;
            margin-bottom: 30px;
            text-transform: uppercase;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Title */
        .main-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 20px;
            perspective: 1000px;
            line-height: 1;
        }

        /* Wave Character Effect */
        .wave-char {
            display: inline-block;
            animation: wave 3s ease-in-out infinite;
            transform-origin: center bottom;
            position: relative;
        }

        @keyframes wave {

            0%,
            100% {
                transform: translateY(0) rotateX(0deg) scale(1);
                color: #ffffff;
                text-shadow:
                    0 0 20px rgba(255, 255, 255, 0.5),
                    0 0 40px rgba(0, 212, 255, 0.3);
            }

            25% {
                transform: translateY(-15px) rotateX(20deg) scale(1.05);
                color: #00d4ff;
                text-shadow:
                    0 0 30px rgba(0, 212, 255, 1),
                    0 0 60px rgba(0, 212, 255, 0.6),
                    0 0 90px rgba(0, 212, 255, 0.3);
            }

            50% {
                transform: translateY(0) rotateX(0deg) scale(1);
                color: #00ffff;
                text-shadow:
                    0 0 30px rgba(0, 255, 255, 1),
                    0 0 60px rgba(0, 255, 255, 0.6);
            }

            75% {
                transform: translateY(-15px) rotateX(-20deg) scale(1.05);
                color: #7df9ff;
                text-shadow:
                    0 0 30px rgba(125, 249, 255, 1),
                    0 0 60px rgba(125, 249, 255, 0.6),
                    0 0 90px rgba(125, 249, 255, 0.3);
            }
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 32px;
            color: #e0e0e0;
            margin-bottom: 15px;
            animation: fadeIn 1.5s ease-out 0.5s both;
        }

        /* Tagline with gradient */
        .tagline {
            font-family: 'Arial', sans-serif;
            font-size: 28px;
            margin-bottom: 40px;
            animation: fadeIn 1.5s ease-out 0.8s both;
        }

        .tagline .highlight {
            background: linear-gradient(90deg, #00d4ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CTA Button */
        .cta-button {
            display: inline-block;
            padding: 18px 50px;
            background: white;
            color: #0a0a0a;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            animation: fadeInUp 1.5s ease-out 1s both;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .cta-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .cta-button span {
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 60px;
            }

            .subtitle {
                font-size: 24px;
            }

            .tagline {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Starfield Background -->
    <div class="stars" id="stars"></div>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="top-label">CONVERSION ENGINEERING</div>

        <h1 class="main-title" id="mainTitle">HANLAN.</h1>

        <p class="subtitle">Transforming digital presence into profit</p>

        <p class="tagline">
            <span class="highlight">Design</span> is easy.
            <span class="highlight">Revenue</span> is our craft.
        </p>

        <a href="#" class="cta-button">
            <span>FREE TRIAL →</span>
        </a>
    </div>

    <script>
        // Create starfield
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Apply wave effect to each character
        const title = document.getElementById('mainTitle');
        const text = title.textContent;
        title.textContent = '';

        text.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.className = 'wave-char';
            span.textContent = char;
            // Stagger the animation for ripple effect
            span.style.animationDelay = `${index * 0.1}s`;
            title.appendChild(span);
        });
    </script>
</body>

</html>
