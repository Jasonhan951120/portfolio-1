<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Space Stream</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            /* Very dark grey instead of pure black for softer feel */
            font-family: 'Source Sans Pro', monospace;
            color: #FFF;
        }

        /* 3D Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 40px;
            box-sizing: border-box;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Centered, floating code block */
        .code-block {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow-y: hidden;
            /* Hide scrollbar for cleaner look, script handles scroll */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #e0e0e0;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        span {
            color: #aaddff;
            /* Slightly blue tinted code */
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: #fff;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="canvas-container"></div>

    <div class="overlay">
        <div class="code-block">
            <div class="text"
                data-text="/*/n * Celestial Navigation Systems/n * Module: Deep Space Telemetry/n * Status: ONLINE/n *//n/nimport { Galaxy, StarSystem } from 'universe';/n/nclass SpaceTimeContinuum {/n    constructor() {/n        this.matter = new Map();/n        this.energy = 0;/n        this.entropy = Infinity;/n    }/n/n    async initializeCoordinates() {/n        console.log('Calibrating sensors...');/n        await this.scanSector('ALPHA-CENTAURI');/n        /n        const singularity = this.detectAnomalies();/n        if (singularity) {/n            return this.engageWarpDrive();/n        }/n    }/n/n    engageWarpDrive() {/n        // Warning: Relativistic effects may occur/n        this.velocity = CONSTANTS.LIGHT_SPEED * 9.8;/n        this.reality.bend();/n    }/n}/n/n// System ready.../n// Waiting for pilot input.../n">
            </div>
            <span class="cursor"></span>
        </div>
    </div>

    <!-- Typing Script -->
    <script>
        const textElement = document.querySelector('.text');
        const rawText = textElement.getAttribute('data-text');
        const lines = rawText.split('/n');
        textElement.innerHTML = ''; // Clear initial

        let lineIdx = 0;
        let charIdx = 0;
        let totalCharCount = 0; // Track total characters for wave delay

        function type() {
            if (lineIdx >= lines.length) return;

            const currentLine = lines[lineIdx];

            // If starting a new line, ensure previous one interacts correctly
            let currentLineEl = document.getElementById('line-' + lineIdx);
            if (!currentLineEl) {
                currentLineEl = document.createElement('div');
                currentLineEl.id = 'line-' + lineIdx;
                currentLineEl.style.minHeight = '1.6em'; // Prevent collapse
                textElement.appendChild(currentLineEl);
            }

            if (charIdx < currentLine.length) {
                const char = currentLine[charIdx];

                // Wrap each character in a span for wave animation
                const charSpan = document.createElement('span');
                charSpan.className = 'wave-char';
                charSpan.textContent = char;

                // Stagger animation delay for ripple effect
                // Each character starts its wave slightly after the previous one
                const delay = (totalCharCount * 0.05) % 3; // Cycle every 3 seconds
                charSpan.style.animationDelay = `${delay}s`;

                currentLineEl.appendChild(charSpan);

                totalCharCount++;
                charIdx++;
                setTimeout(type, Math.random() * 30 + 20); // Random typing speed
            } else {
                lineIdx++;
                charIdx = 0;
                setTimeout(type, 300); // Pause at end of line
            }

            // Keep cursor in view
            const codeBlock = document.querySelector('.code-block');
            codeBlock.scrollTop = codeBlock.scrollHeight;
        }

        setTimeout(type, 1000);
    </script>

    <!-- Three.js Floating Effect -->
    <script type="module">
        import * as THREE from 'three';

        // 1. Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002); // Soft fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Texture Generator (Soft Glow)
        function createSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const particleTexture = createSprite();

        // 3. Create Particles
        // We'll create multiple systems for parallax
        const systems = [];

        function createSystem(count, size, range, speed) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorOptions = [
                new THREE.Color(0x7df9ff), // Electric Blue
                new THREE.Color(0xffffff), // White
                new THREE.Color(0xd4af37), // Soft Gold
                new THREE.Color(0xe0b0ff)  // Mauve/Purple
            ];

            for (let i = 0; i < count; i++) {
                pos[i * 3] = (Math.random() - 0.5) * range;
                pos[i * 3 + 1] = (Math.random() - 0.5) * range;
                pos[i * 3 + 2] = (Math.random() - 0.5) * range;

                const c = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: size,
                map: particleTexture,
                transparent: true,
                vertexColors: true,
                opacity: 0.8,
                depthWrite: false, // Important for transparency overlap
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geo, mat);
            // Random initial rotation
            points.rotation.x = Math.random() * 6;
            points.rotation.y = Math.random() * 6;

            scene.add(points);
            systems.push({ mesh: points, speed: speed });
        }

        // Layer 1: Background (Many, small, slow)
        createSystem(2000, 0.8, 200, 0.0005);

        // Layer 2: Midground (Fewer, medium, medium speed)
        createSystem(500, 2.5, 150, 0.001);

        // Layer 3: Foreground (Few, large, fast)
        createSystem(100, 5, 100, 0.002);


        // 4. Interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.1;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.1;
        });

        // 5. Animate
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;

            // Smooth camera movement
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // Rotate systems
            systems.forEach(sys => {
                sys.mesh.rotation.y += sys.speed;
                sys.mesh.rotation.x += sys.speed * 0.5;
            });

            // Pulse effect for "lively" feel
            const time = Date.now() * 0.001;
            systems[1].mesh.material.size = 2.5 + Math.sin(time) * 0.5; // Midground breathes

            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Error Handler
        window.onerror = function (message, source, lineno, colno, error) {
            alert("Error: " + message);
        };
    </script>
</body>

</html>
