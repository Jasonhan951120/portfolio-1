<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Morphing - EqtyLab Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c1b;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --node-glow: rgba(139, 92, 246, 0.6);
            --transition-speed: 1.2s;
            --ease-out-back: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(circle at center, #1b2045 0%, var(--bg-deep) 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- BACKGROUND STARS --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- MAIN UI CONTAINER --- */
        .main-ui {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .main-ui.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-text {
            flex: 0 0 450px;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 24px;
            color: #f8fafc;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            font-weight: 300;
        }

        /* --- PARTICLE / NODE WORLD --- */
        #particle-world {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            z-index: 5;
        }

        .node-group {
            position: absolute;
            transform-style: preserve-3d;
            transition: all var(--transition-speed) var(--ease-out-back);
        }

        /* The Dot */
        .dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--node-glow), 0 0 30px var(--node-glow);
            position: relative;
            z-index: 2;
        }

        /* The Hanging String */
        .string {
            position: absolute;
            top: -100vh;
            left: 50%;
            width: 1px;
            height: 100vh;
            background: linear-gradient(to top, rgba(139, 92, 246, 0.3), transparent);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
        }

        /* The Label */
        .label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) translateX(20px);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 500;
            color: #e2e8f0;
            opacity: 0;
            backdrop-filter: blur(8px);
            transition: all var(--transition-speed) ease;
            pointer-events: none;
        }

        /* States */
        body.is-globe .node-group {
            /* Handled by JS inline styles for 3d sphere */
        }

        body.is-globe .string {
            opacity: 0;
        }

        body.is-globe .label {
            opacity: 0;
        }

        body.is-network .node-group {
            /* Transition to list positions */
        }

        body.is-network .string {
            opacity: 1;
        }

        body.is-network .label {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* Clicking trigger area */
        #trigger-zone {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            z-index: 100;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        #trigger-zone:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>

<body class="is-globe">

    <div class="stars-container" id="stars"></div>

    <div id="particle-world">
        <!-- Nodes injected via JS -->
    </div>

    <div class="main-ui" id="ui">
        <div class="hero-text">
            <h1>Issues arise<br>every day</h1>
            <p>Outages are inevitable, but with the<br>right approach, chaos isn't.</p>
        </div>
        <div style="flex: 1;"></div>
    </div>

    <div id="trigger-zone" onclick="toggleState()">Explode Morphing</div>

    <script>
        const world = document.getElementById('particle-world');
        const ui = document.getElementById('ui');
        const nodeData = [
            "Proof or it's not real",
            "Perfect rhythm",
            "All systems stable",
            "Incidents resolved",
            "Data flow active",
            "Protocol synchronized",
            "Neural paths cleared",
            "Buffer optimized",
            "Latency minimized"
        ];

        const nodeElements = [];
        const count = 15; // Extra dots for fuller sphere

        // 1. Initialize Nodes
        for (let i = 0; i < count; i++) {
            const group = document.createElement('div');
            group.className = 'node-group';

            const dot = document.createElement('div');
            dot.className = 'dot';

            const string = document.createElement('div');
            string.className = 'string';

            const labelStr = nodeData[i % nodeData.length];
            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = labelStr;

            group.appendChild(string);
            group.appendChild(dot);
            if (i < 4) group.appendChild(label); // Only label first few to match UI

            world.appendChild(group);
            nodeElements.push({
                el: group,
                label: label,
                // Spherical coords
                phi: Math.acos(-1 + (2 * i) / count),
                theta: Math.sqrt(count * Math.PI) * Math.acos(-1 + (2 * i) / count),
                // Final Network positions (relative to right side)
                finalX: 200 + (Math.random() * 100),
                finalY: -200 + (i * 80)
            });
        }

        let isNetwork = false;
        let rotationAngle = 0;

        function updateGlobe() {
            if (isNetwork) return;

            rotationAngle += 0.5;
            const radius = 250;

            nodeElements.forEach((node, i) => {
                const angle = (rotationAngle + (i * 360 / count)) * (Math.PI / 180);

                // Sphere math
                const x = radius * Math.sin(node.phi) * Math.cos(angle);
                const y = radius * Math.sin(node.phi) * Math.sin(angle);
                const z = radius * Math.cos(node.phi);

                node.el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

                // Depth fading
                const opacity = (z + radius) / (2 * radius);
                node.el.style.opacity = 0.2 + (opacity * 0.8);
            });

            requestAnimationFrame(updateGlobe);
        }

        function toggleState() {
            if (!isNetwork) {
                // EXPLODE!
                document.body.classList.remove('is-globe');
                document.body.classList.add('is-exploding');

                // Briefly fly out
                nodeElements.forEach(node => {
                    const tx = (Math.random() - 0.5) * 1000;
                    const ty = (Math.random() - 0.5) * 1000;
                    const tz = (Math.random() - 0.5) * 1000;
                    node.el.style.transform = `translate3d(${tx}px, ${ty}px, ${tz}px) scale(0.5)`;
                    node.el.style.opacity = 0;
                });

                // Settle into Network
                setTimeout(() => {
                    isNetwork = true;
                    document.body.classList.remove('is-exploding');
                    document.body.classList.add('is-network');
                    ui.classList.add('is-visible');

                    nodeElements.forEach((node, i) => {
                        const x = node.finalX;
                        const y = node.finalY;
                        node.el.style.transform = `translate3d(${x}px, ${y}px, 0px) scale(1)`;
                        node.el.style.opacity = 1;
                    });
                }, 800);

            } else {
                // Back to Globe
                isNetwork = false;
                document.body.classList.remove('is-network');
                document.body.classList.add('is-globe');
                ui.classList.remove('is-visible');
                updateGlobe();
            }
        }

        // Start animation
        updateGlobe();

        // Stars
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = '1px';
                star.style.height = '1px';
                star.style.background = 'white';
                star.style.opacity = Math.random();
                container.appendChild(star);
            }
        }
        createStars();

    </script>
</body>

</html>
