<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Debug Space</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: red;
        }

        /* Red background to see if file loads */
        #canvas-container {
            width: 100%;
            height: 100vh;
            background: blue;
        }

        /* Blue container */
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>
    <script type="module">
        import * as THREE from 'three';

        try {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x00ff00); // Green scene

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Yellow box
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

            console.log("Three.js initialized successfully");
            alert("Three.js working! You should see a green screen with a yellow spinning cube.");
        } catch (e) {
            alert("Three.js Error: " + e.message);
        }
    </script>
</body>

</html>
