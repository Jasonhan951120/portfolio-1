<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Deep Impact</title>
    <link href="https://fonts.cdnfonts.com/css/pp-neue-montreal" rel="stylesheet">
    <style>
        @font-face {
            font-family: "PPSupplyMono";
            src: url("https://assets.codepen.io/7558/PPSupplyMono-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --warm-off-white: #ffffff;
            --warm-off-white-dim: #cccccc;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --background-dark: #000000;
            /* Pure black for space */
            --font-primary: "PP Neue Montreal", sans-serif;
            --font-secondary: "PPSupplyMono", monospace;
            --spacing-large: 2rem;
        }

        *,
        *:before,
        *:after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: var(--background-dark);
            color: var(--text-primary);
            font-family: var(--font-secondary);
            font-size: 12px;
        }

        /* Canvas Background */
        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* UI Layer */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            /* Let clicks pass to canvas */
            width: 100%;
            height: 100vh;
        }

        /* Header */
        .header-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: var(--spacing-large);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-logo h1 {
            font-family: var(--font-primary);
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            /* Subtle glow */
        }

        /* Hero Content */
        .hero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: auto;
            /* Allow text selection if needed */
        }

        .hero h1 {
            font-family: var(--font-primary);
            font-size: 5vw;
            /* Responsive size */
            line-height: 0.9;
            font-weight: 400;
            margin-bottom: 2rem;
            text-transform: none;
            /* Stronger shadow for impact */
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .hero h2 {
            font-family: var(--font-secondary);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            line-height: 1.6;
            font-weight: normal;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(0, 0, 0, 1);
            background: rgba(0, 0, 0, 0.3);
            /* Slight backdrop for readability */
            display: inline-block;
            padding: 10px;
            backdrop-filter: blur(2px);
            border-radius: 4px;
        }

        /* Corner Stats */
        .coordinates {
            position: absolute;
            bottom: var(--spacing-large);
            right: var(--spacing-large);
            text-align: right;
            color: var(--text-secondary);
        }

        .footer-links {
            position: absolute;
            bottom: var(--spacing-large);
            left: var(--spacing-large);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: auto;
        }

        .footer-link {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: #fff;
            text-shadow: 0 0 8px #fff;
        }

        /* Tweakpane Container */
        #ui-container {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            pointer-events: auto;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <!-- 3D Canvas -->
    <div id="container"></div>

    <!-- UI Layer -->
    <div class="ui-layer">
        <!-- Header Removed -->

        <div class="hero">
            <h1>Where matter becomes<br>thought and thought<br>becomes form</h1>
            <h2 id="story-text">
                our vessel drifts at coordinates (0.00, 0.00)<br>
                gravitational field extends 0.10 units into quantum foam<br>
                currently merging with 0 other entities
            </h2>
        </div>

        <div class="footer-links">
            <a href="#" class="footer-link">Fluid Dynamics</a>
            <a href="#" class="footer-link">Organic Shapes</a>
            <a href="#" class="footer-link">Interactive Forms</a>
        </div>

        <div class="coordinates" id="status-text">
            <p>System State • Active</p>
            <p>where consciousness flows</p>
        </div>
    </div>

    <!-- Space Impact Script -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer;
        let stars, starGeo, cloudParticles = [];
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        // Settings
        const STAR_COUNT = 8000;

        init();
        animate();

        function init() {
            const container = document.getElementById("container");

            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 1;
            camera.rotation.x = 1.16;
            camera.rotation.y = -0.12;
            camera.rotation.z = 0.27;

            renderer = new THREE.WebGLRenderer({ antialias: false }); // Post-processing handles AA usually
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // --- Post Processing (BLOOM) ---
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.2; // High intensity bloom
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // --- 1. Ambient Light ---
            const ambient = new THREE.AmbientLight(0x555555);
            scene.add(ambient);

            // --- 2. Directional Light (Blue/Purple) ---
            const directionalLight = new THREE.DirectionalLight(0xff8c19);
            directionalLight.position.set(0, 0, 1);
            scene.add(directionalLight);

            const orangeLight = new THREE.PointLight(0xcc6600, 50, 450, 1.7);
            orangeLight.position.set(200, 300, 100);
            scene.add(orangeLight);

            const redLight = new THREE.PointLight(0xd8547e, 50, 450, 1.7);
            redLight.position.set(100, 300, 100);
            scene.add(redLight);

            const blueLight = new THREE.PointLight(0x3677ac, 50, 450, 1.7);
            blueLight.position.set(300, 300, 200);
            scene.add(blueLight);


            // --- 3. Stars ---
            starGeo = new THREE.BufferGeometry();
            const starPos = [];
            const starSpeeds = []; // Track speed for warp effect

            for (let i = 0; i < STAR_COUNT; i++) {
                const x = (Math.random() - 0.5) * 600;
                const y = (Math.random() - 0.5) * 600;
                const z = (Math.random() - 0.5) * 600;
                starPos.push(x, y, z);
                starSpeeds.push(Math.random());
            }

            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.7,
                transparent: true,
                opacity: 0.8,
                map: createCircleTexture(),
                blending: THREE.AdditiveBlending
            });

            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            // --- 4. Nebula Clouds ---
            // Using a procedural "cloud" texture generation approach to avoid external images
            const cloudTexture = createCloudTexture();
            const cloudGeo = new THREE.PlaneGeometry(500, 500);
            const cloudMaterial = new THREE.MeshLambertMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.3, // Subtle
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            for (let p = 0; p < 15; p++) {
                const cloud = new THREE.Mesh(cloudGeo, cloudMaterial);
                cloud.position.set(
                    Math.random() * 800 - 400,
                    500,
                    Math.random() * 500 - 450
                );
                cloud.rotation.x = 1.16;
                cloud.rotation.y = -0.12;
                cloud.rotation.z = Math.random() * 360;
                cloud.material.opacity = 0.3; // Re-apply just in case
                cloudParticles.push(cloud);
                scene.add(cloud);
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onDocumentMouseMove);
        }

        // Texture Helpers
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createCloudTexture() {
            // Simple procedural smoke/cloud texture
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128; // Smaller for perf
            const ctx = canvas.getContext('2d');

            // Draw a fuzzy blob
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(200,200,255,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.05;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.05;

            updateUI(event.clientX, event.clientY);
        }

        function updateUI(x, y) {
            const storyText = document.getElementById("story-text");
            if (storyText) {
                const displayX = (x / window.innerWidth).toFixed(2);
                const displayY = (y / window.innerHeight).toFixed(2);

                // Simulate fluctuating energy field
                const fieldEnergy = (0.08 + Math.random() * 0.04).toFixed(2);

                // Simulate entities passing by
                const entities = Math.floor(Math.random() * 2);

                storyText.innerHTML =
                    `our vessel drifts at coordinates (${displayX}, ${displayY})<br>` +
                    `gravitational field extends ${fieldEnergy} units into quantum foam<br>` +
                    `currently merging with ${entities} other entities`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Cloud Rotation
            cloudParticles.forEach(p => {
                p.rotation.z -= 0.001;
            });

            // Star Movement (Warp effect)
            const positions = stars.geometry.attributes.position.array;
            for (let i = 0; i < STAR_COUNT; i++) {
                // Moving effectively "down" relative to camera (Z axis) or simply rotating
                // For "fly through", we move star Z toward positive
                positions[i * 3 + 1] -= 0.5; // Move Y down

                if (positions[i * 3 + 1] < -300) {
                    positions[i * 3 + 1] = 300;
                }
            }
            stars.geometry.attributes.position.needsUpdate = true;
            stars.rotation.y += 0.002;

            // Camera movement
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            scene.rotation.y += 0.0005;

            // Bloom gives the "Impact"
            composer.render();
        }
    </script>
</body>

</html>
