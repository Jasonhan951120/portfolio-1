<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANLAN - Digital Infrastructure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            /* Deep dark background */
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 1. Purple Glow Orb (Background) */
        .ambient-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(90, 40, 200, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* 2. Code Grid Canvas */
        #codeGridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 3. Scanner Canvas (Overlay) */
        #scannerCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* 4. UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            /* Let clicks pass through to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Header UI */
        .header {
            display: flex;
            justify-content: flex-end;
            /* Right aligned button */
            align-items: center;
            pointer-events: auto;
        }

        .cta-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 100px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Footer UI (Big Text) */
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        .headline {
            font-family: 'Inter', sans-serif;
            font-size: clamp(40px, 6vw, 100px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: #fff;
            mix-blend-mode: normal;
        }

        .headline span.highlight {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
        }

        .description {
            max-width: 400px;
            color: #888;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: right;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        /* Floating particles (Three.js container if needed, but we stick to 2D for crisp text) */

        /* White Dot Indicator */
        .active-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            top: 30%;
            left: 20%;
            z-index: 5;
            animation: moveDot 10s infinite;
        }

        @keyframes moveDot {
            0% {
                top: 30%;
                left: 20%;
            }

            50% {
                top: 40%;
                left: 80%;
            }

            100% {
                top: 30%;
                left: 20%;
            }
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="ambient-glow"></div>

    <!-- Code Grid -->
    <canvas id="codeGridCanvas"></canvas>
    <!-- Scanner Beam -->
    <canvas id="scannerCanvas"></canvas>

    <!-- Decoration Dot -->
    <div class="active-dot"></div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header class="header">
            <a href="#" class="cta-btn">Get Free Audit</a>
        </header>

        <div class="footer-content">
            <div class="headline">
                We don't<br>
                Just Build<br>
                Websites.
            </div>
            <div class="description">
                Experience high-performance digital infrastructure for businesses.
                It's about strategic structure and high-conversion marketing.
            </div>
        </div>
    </div>

    <script>
        /**
         * LOGIC: 
         * 1. Draw a grid of dark code characters.
         * 2. A "Scanner" (light beam) moves across the screen.
         * 3. Characters under the scanner light up white/purple and shuffle/type.
         * 4. Ambient particles float around.
         */

        const gridCanvas = document.getElementById('codeGridCanvas');
        const gridCtx = gridCanvas.getContext('2d');

        const scannerCanvas = document.getElementById('scannerCanvas');
        const scannerCtx = scannerCanvas.getContext('2d');

        let width, height;
        let cells = [];
        const charSize = 24; // 그리드 크기
        const chars = "H01{}[]<>@#&XYZ=/";

        // 스캐너 상태
        const scanner = {
            x: 0,
            width: 150, // 스캐너 빔 너비
            speed: 3,
            direction: 1
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            gridCanvas.width = width;
            gridCanvas.height = height;
            scannerCanvas.width = width;
            scannerCanvas.height = height;
            initGrid();
        }

        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.char = chars[Math.floor(Math.random() * chars.length)];
                this.alpha = 0.05; // 기본적으로 아주 어두움
                this.targetAlpha = 0.05;
                this.isHighlighted = false;
                this.color = '#333';
            }

            update(scanX, scanW) {
                // 스캐너 범위 안에 있는지 확인
                const dist = Math.abs(this.x - scanX);

                if (dist < scanW / 2) {
                    // 스캔 중!
                    this.isHighlighted = true;
                    this.targetAlpha = 1 - (dist / (scanW / 2)); // 중심일수록 밝음

                    // 타이핑 효과: 스캔될 때 글자 바뀜
                    if (Math.random() < 0.1) {
                        this.char = chars[Math.floor(Math.random() * chars.length)];
                    }

                    // 색상 효과: 중심부는 흰색, 주변은 보라색
                    if (this.targetAlpha > 0.8) this.color = '#fff';
                    else this.color = '#a78bfa'; // violet-400

                } else {
                    // 스캔 아님 -> 서서히 어두워짐
                    this.isHighlighted = false;
                    this.targetAlpha = 0.05; // 기본 밝기
                    this.color = '#444';
                }

                // 부드러운 밝기 전환
                this.alpha += (this.targetAlpha - this.alpha) * 0.1;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.font = '16px "JetBrains Mono", monospace';
                ctx.fillText(this.char, this.x, this.y);
            }
        }

        function initGrid() {
            cells = [];
            const cols = Math.ceil(width / charSize);
            const rows = Math.ceil(height / charSize);

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    // 약간의 랜덤 오프셋을 주어 너무 정직한 그리드 탈피
                    cells.push(new Cell(i * charSize + 10, j * charSize + 15));
                }
            }
        }

        function drawScannerBeam() {
            // 스캐너 빔 자체를 그리기 (scannerCanvas에)
            scannerCtx.clearRect(0, 0, width, height);

            // 수직 그라데이션 빔
            const gradient = scannerCtx.createLinearGradient(scanner.x - scanner.width / 2, 0, scanner.x + scanner.width / 2, 0);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0)');
            gradient.addColorStop(0.5, 'rgba(139, 92, 246, 0.2)'); // 보라색 빛
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');

            scannerCtx.fillStyle = gradient;
            scannerCtx.fillRect(scanner.x - scanner.width / 2, 0, scanner.width, height);

            // 얇은 중심선
            scannerCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            scannerCtx.fillRect(scanner.x - 1, 0, 2, height);
        }

        function animate() {
            // 1. 스캐너 이동
            scanner.x += scanner.speed * scanner.direction;

            // 화면 끝에 닿으면 반환
            // 또는 마우스 위치를 따라가게 할 수도 있음.
            // 여기서는 자동 왕복
            if (scanner.x > width + 100 || scanner.x < -100) {
                scanner.direction *= -1;
            }

            // 마우스 쪽으로 유도하려면 아래 주석 해제
            /* 
            if (mouseX) {
                scanner.x += (mouseX - scanner.x) * 0.05;
            }
            */

            // 2. 그리드 그리기 (gridCanvas)
            gridCtx.clearRect(0, 0, width, height);

            // 은은한 그리드 라인 배경 (선택사항)
            // gridCtx.strokeStyle = 'rgba(255,255,255,0.02)';
            // gridCtx.beginPath(); ...

            cells.forEach(cell => {
                cell.update(scanner.x, scanner.width);
                cell.draw(gridCtx);
            });

            // 3. 빔 그리기
            drawScannerBeam();

            requestAnimationFrame(animate);
        }

        let mouseX = null;
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            // 마우스가 있으면 스캐너가 마우스를 따라가게 변경
            // 위 animate 함수에서 로직 변경 필요
        });

        window.addEventListener('resize', resize);

        // 시작
        resize();
        animate();

    </script>
</body>

</html>
