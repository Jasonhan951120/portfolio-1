<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Diagram - Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1f3a 0%, #0a0d1a 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            color: white;
        }

        /* --- SHOOTING STARS --- */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom,
                    rgba(139, 92, 246, 1) 0%,
                    rgba(59, 130, 246, 0.8) 50%,
                    transparent 100%);
            z-index: 1;
            opacity: 0;
            animation: shoot 4s linear infinite;
            filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.6));
        }

        @keyframes shoot {
            0% {
                opacity: 0;
                transform: translateY(-100px) translateX(0) rotate(45deg);
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
                transform: translateY(100vh) translateX(150px) rotate(45deg);
            }
        }

        .shooting-star:nth-child(1) {
            left: 20%;
            animation-delay: 0s;
            animation-duration: 3.5s;
        }

        .shooting-star:nth-child(2) {
            left: 50%;
            animation-delay: 1.8s;
            animation-duration: 4s;
        }

        .shooting-star:nth-child(3) {
            left: 80%;
            animation-delay: 0.5s;
            animation-duration: 3.8s;
        }

        .shooting-star:nth-child(4) {
            left: 35%;
            animation-delay: 2.5s;
            animation-duration: 3.2s;
        }

        .shooting-star:nth-child(5) {
            left: 65%;
            animation-delay: 1.2s;
            animation-duration: 4.2s;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            padding: 60px;
            background: rgba(30, 35, 60, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            gap: 80px;
        }

        /* --- LEFT SIDE: TEXT --- */
        .text-section {
            flex: 1;
        }

        .text-section h1 {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #e0e7ff;
        }

        .text-section p {
            font-size: 1.1rem;
            color: #a5b4fc;
            line-height: 1.6;
            font-weight: 300;
        }

        /* --- RIGHT SIDE: NETWORK DIAGRAM --- */
        .diagram-section {
            flex: 1;
            position: relative;
            height: 400px;
        }

        /* Vertical line */
        .vertical-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom,
                    transparent 0%,
                    rgba(139, 92, 246, 0.5) 20%,
                    rgba(139, 92, 246, 0.5) 80%,
                    transparent 100%);
            transform: translateX(-50%);
        }

        /* Node container */
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .node.left {
            right: 50%;
            padding-right: 30px;
            justify-content: flex-end;
        }

        .node.right {
            left: 50%;
            padding-left: 30px;
            justify-content: flex-start;
        }

        /* Connecting line */
        .node::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 2px;
            background: rgba(139, 92, 246, 0.4);
        }

        .node.left::before {
            right: 0;
        }

        .node.right::before {
            left: 0;
        }

        /* Dot on the vertical line */
        .node::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        .node.left::after {
            right: -6px;
        }

        .node.right::after {
            left: -6px;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* Label styling */
        .label {
            padding: 12px 24px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #c7d2fe;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        /* Position nodes */
        .node:nth-child(2) {
            top: 5%;
        }

        .node:nth-child(3) {
            top: 30%;
        }

        .node:nth-child(4) {
            top: 55%;
        }

        .node:nth-child(5) {
            top: 80%;
        }

        /* Stagger float animation */
        .node:nth-child(2) {
            animation-delay: 0s;
        }

        .node:nth-child(3) {
            animation-delay: 0.5s;
        }

        .node:nth-child(4) {
            animation-delay: 1s;
        }

        .node:nth-child(5) {
            animation-delay: 1.5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 968px) {
            .container {
                flex-direction: column;
                gap: 40px;
            }

            .text-section h1 {
                font-size: 2.5rem;
            }

            .diagram-section {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Shooting Stars -->
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <div class="container">
        <!-- Left: Text Section -->
        <div class="text-section">
            <h1>Issues arise<br>every day</h1>
            <p>Issues arise every day. Outages are inevitable,<br>but with the right approach, chaos isn't.</p>
        </div>

        <!-- Right: Network Diagram -->
        <div class="diagram-section">
            <div class="vertical-line"></div>

            <div class="node right">
                <div class="label">Proof or it's not real</div>
            </div>

            <div class="node left">
                <div class="label">Perfect rhythm</div>
            </div>

            <div class="node right">
                <div class="label">All systems stable</div>
            </div>

            <div class="node left">
                <div class="label">Incidents resolved</div>
            </div>
        </div>
    </div>

</body>

</html>
